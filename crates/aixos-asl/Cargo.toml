# PL-76: aixos-asl — ASL-seL4 integration bridge (bare-metal no_std/no_alloc)
#
# Dep chain audit — crates that pull Vec via asl-haniel:
#   asl-phoenix-desktop  → asl-haniel (Vec) — EXCLUDED
#   asl-onyxia-pd        → asl-haniel (Vec) — EXCLUDED
#   asl-edisondb-pd      → asl-datatier (Vec) — EXCLUDED
#   asl-haniel-canvas-pd → asl-haniel (Vec) — EXCLUDED
#   asl-sovereign-boot-proof → asl-haniel-canvas-pd — EXCLUDED
#
# Clean no_alloc crates (only these are included):
#   asl-common           → no alloc
#   asl-arpi-ipc         → no alloc
#   asl-shell-pd         → asl-common + asl-arpi-ipc only
#   asl-axon-exec-pd     → asl-axon-bridge + asl-shell-pd (both no alloc)

[package]
name        = "aixos-asl"
version     = "2.0.0"
edition     = "2021"
authors     = ["Edison Lepiten <aieonyx.eu@gmail.com>"]
license     = "Apache-2.0"
description = "ASL-seL4 integration bridge — sovereign PD contracts in aiXos boot"

[dependencies]
asl-common       = { path = "../../asl/asl-common" }
asl-arpi-ipc     = { path = "../../asl/asl-arpi-ipc" }
asl-shell-pd     = { path = "../../asl/pds/asl-shell-pd" }
asl-axon-exec-pd = { path = "../../asl/pds/asl-axon-exec-pd" }

[features]
default = []

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(kani)'] }
