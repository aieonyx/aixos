# PL-76: aixos-asl — ASL-seL4 integration bridge for aiXos Phoenix
# no_std — compiles for aarch64-unknown-none bare-metal

[package]
name        = "aixos-asl"
version     = "2.0.0"
edition     = "2021"
authors     = ["Edison Lepiten <aieonyx.eu@gmail.com>"]
license     = "Apache-2.0"
description = "ASL-seL4 integration bridge — wires sovereign PD contracts into aiXos Phoenix"

[dependencies]
# ASL PD crates (path = submodule at asl/)
# NO std feature — all crates compile no_std for aarch64-unknown-none
asl-common               = { path = "../../asl/asl-common" }
asl-arpi-ipc             = { path = "../../asl/asl-arpi-ipc" }
asl-phoenix-desktop      = { path = "../../asl/pds/asl-phoenix-desktop" }
asl-shell-pd             = { path = "../../asl/pds/asl-shell-pd" }
asl-edisondb-pd          = { path = "../../asl/pds/asl-edisondb-pd" }
asl-onyxia-pd            = { path = "../../asl/pds/asl-onyxia-pd" }
asl-arpi-broker-live     = { path = "../../asl/pds/asl-arpi-broker-live" }
asl-axon-exec-pd         = { path = "../../asl/pds/asl-axon-exec-pd" }
asl-haniel-canvas-pd     = { path = "../../asl/pds/asl-haniel-canvas-pd" }
asl-sovereign-boot-proof = { path = "../../asl/pds/asl-sovereign-boot-proof" }

[features]
default = []

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(kani)'] }
