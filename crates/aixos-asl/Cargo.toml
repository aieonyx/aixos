# PL-76: aixos-asl — ASL-seL4 integration bridge for aiXos Phoenix
# Bare-metal no_std — only includes PDs that are Vec-free

[package]
name        = "aixos-asl"
version     = "2.0.0"
edition     = "2021"
authors     = ["Edison Lepiten <aieonyx.eu@gmail.com>"]
license     = "Apache-2.0"
description = "ASL-seL4 integration bridge — sovereign PD contracts in aiXos boot"

[dependencies]
# Only pure no_std/no_alloc ASL PDs (asl-haniel uses Vec — excluded)
asl-common           = { path = "../../asl/asl-common" }
asl-arpi-ipc         = { path = "../../asl/asl-arpi-ipc" }
asl-phoenix-desktop  = { path = "../../asl/pds/asl-phoenix-desktop" }
asl-shell-pd         = { path = "../../asl/pds/asl-shell-pd" }
asl-edisondb-pd      = { path = "../../asl/pds/asl-edisondb-pd" }
asl-onyxia-pd        = { path = "../../asl/pds/asl-onyxia-pd" }
asl-axon-exec-pd     = { path = "../../asl/pds/asl-axon-exec-pd" }
# asl-haniel-canvas-pd excluded — depends on asl-haniel which uses Vec
# asl-sovereign-boot-proof excluded — depends on asl-haniel-canvas-pd
# asl-arpi-broker-live excluded — depends on asl-haniel via onyxia

[features]
default = []

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(kani)'] }
